[package]
name = "jgengine-player"
version = "0.1.0"
edition = "2021"

[lib]
name = "jgengine_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# jgengine desktop --steamworks turns this on in a staged game; the player links no Steamworks.
steam = []

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
