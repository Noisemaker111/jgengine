name: CI

# Default every job's GITHUB_TOKEN to read-only; jobs that need more (the
# red-main reporter's issues: write) escalate at the job level.
permissions:
  contents: read

on:
  push:
    branches: [main, beta]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Decides how much of the game matrix this run pays for. Booting every reference game
  # and measuring its frame budget costs a runner and ~90 s per game, and a docs, test or
  # unrelated-package change cannot move either, so a PR runs them only when a changed path
  # can reach them. `scripts/ci-scope.ts` owns the map; `scripts/ci-scope.test.ts` holds it.
  #
  #   full  — smoke-game and perf-game: a package a game loads (core, shell, react, assets,
  #           navbake, rapier, jgengine), Games/, a script that boots or measures a game,
  #           a workflow, the release PR, or any path the map does not know.
  #   smoke — smoke-game only: a rendered surface no game loads (the editor).
  #   none  — neither: prose, skills, change notes, the web app, server and CLI packages,
  #           lane tooling, repo config, test files.
  #
  # #2218 changed movement, scene and runtime and merged with both gates skipped; #2342
  # changed the react menu and skipped them the same way, so a path a game loads always
  # pays. `smoke` and `perf` fail when the verdict needed a job that did not run, and both
  # print what a skip skipped.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      games: ${{ steps.scope.outputs.games }}
      gameList: ${{ steps.scope.outputs.gameList }}
      tests: ${{ steps.scope.outputs.tests }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "push to ${{ github.ref }} runs the full gate"
            bun scripts/ci-scope.ts --all --github-output
            exit 0
          fi
          git fetch --no-tags origin "$BASE"
          bun scripts/ci-scope.ts --base "origin/$BASE" --github-output

  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check-artifacts
      - run: bun run check-stage-skills
      - run: bun run check-skills
      - run: git fetch --no-tags origin main
      - run: bun run check-changelog
      - run: bun run build
      - run: bun run check-skill-api
      - run: bun run check-orphan-ratchet
      - run: bun run check:fixture-location
      # A test that asserts one platform's path separator passes here and fails on the other runner.
      - run: bun run check:path-portability
      # One launch/retry block for the engine and for the scaffold every `jgengine create` ships.
      - run: bun run check:scaffold-launch
      # A hand-rolled capture script must stay headless; `--headed` is the only window.
      - run: bun run check:capture-hygiene
      # A runtime change with no changed test needs a `Prevention: none - <reason>` line in the
      # PR body (#2109's sibling lesson: a fix that leaves no failing test teaches nobody).
      - name: every changed runtime path carries a regression test
        env:
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "check:fix-has-test skipped: a push has no PR body; the rule reads the body of a pull request"
            exit 0
          fi
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          bun run check:fix-has-test --base "$BASE_SHA" --body-file "$RUNNER_TEMP/pr-body.txt"
      # Needs the `bun run build` above.
      - run: bun run check-export-manifest

  # PRs run everything main runs, split into parallel jobs, so squash auto-merge cannot land a red main.
  # Games/ is cloned at the SHA in scripts/games-ref.txt; a games-repo push changes nothing here until a PR bumps it.
  # `bun run check-types` ran its independent stages one after another: 59 s on a runner, of
  # which the tsc fan-out was 21 s and three generators 23 s. scripts/type-shard.ts runs the
  # same stages from the same plan with four in flight, heaviest first, and keeps this one
  # check name. A second job would have paid 15 s of checkout, install and build before its
  # first stage and taken a slot from the 20-job cap.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run games:clone
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}
      - run: bun scripts/type-shard.ts

  # One bun process over every test file took 5m37s of test time on a runner. The same
  # files are split by cost into nine jobs whose deepest measured 59 s, which is what fits
  # the account's 20-job cap with room for one more run in flight - three jobs fewer than
  # the ten this started at. scripts/test-shard.ts owns which files each letter runs and
  # what it prepares first, so rebalancing never touches this file; it fails if a test
  # file falls outside every shard, and scripts/test-shard.test.ts fails if this matrix
  # and the script's shard names drift apart. `ci` needs `test`, which aggregates every
  # shard - a red shard fails `ci`. A diff that only adds change notes runs none of them:
  # no test reads `changes/`, and `quick`'s check-changelog still validates the note.
  test:
    needs: [changes]
    if: needs.changes.outputs.tests != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c, d, e, f, g, h, i]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The shard runs the build and the Games clone only when its own tests read them,
      # which is why seven of these eight jobs no longer pay either.
      - run: bun scripts/test-shard.ts ${{ matrix.shard }}
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun --cwd=apps/web run build

  # Every game is launched once per PR. `perf-game` already fails when a game throws at
  # boot: `measureGame` waits on the same `data-jg-capture` handshake `bun run smoke` does
  # and throws on `error` or the 90 s timeout, so a separate smoke job booted the same four
  # games a second time for the same failure. The `smoke` check below reads this job's
  # result instead, and the matrix is the scope's game list: every game for frame work, the
  # representative game for a shared surface.
  perf-game:
    needs: [changes]
    if: needs.changes.outputs.games != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.changes.outputs.gameList) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run games:clone
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}
      # 2 of the first 32 leg runs died on a cold Chrome start ("debugger not ready
      # … within 30000ms") and passed on a plain rerun. A budget breach fails again,
      # so the retry hides nothing; it stops a launch flake from paging a PR owner.
      # One step, not a second step after `failure()`: a failed step keeps the job red
      # even when a later step passes, so the retry only counts from inside the step.
      - name: perf gate (one retry after a browser launch flake)
        run: bun run perf:gate --games ${{ matrix.game }} || bun run perf:gate --games ${{ matrix.game }}
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # The `smoke` check the merge requires, fed by the one job that boots games: a game that
  # throws at boot fails `perf-game` (the capture handshake is the same one `bun run smoke`
  # used), and a skip says which paths let it skip.
  smoke:
    needs: [changes, perf-game]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: smoke verdict
        env:
          SCOPE: ${{ needs.changes.outputs.games }}
          GAMES: ${{ needs.changes.outputs.gameList }}
          REASON: ${{ needs.changes.outputs.reason }}
          BOOTS: ${{ needs.perf-game.result }}
        run: |
          echo "scope=$SCOPE $GAMES ($REASON)"
          if [ "$SCOPE" = "none" ]; then
            test "$BOOTS" = "skipped"
            echo "skipped: no changed path can change what a game boots ($REASON)"
            exit 0
          fi
          test "$BOOTS" = "success"
          echo "every game in $GAMES booted clean and stayed inside its budget"

  # The CPU timing budgets (nav crowd, perception, utility, visibility, off-screen,
  # flock, paths) assert via `bench:cpu` with JG_TIMING_GATE=1; the unit suite keeps
  # measuring and printing them without a pass/fail ceiling. It needs no browser and
  # takes ~40 s, and core logic in any package can move a budget, so it runs on every
  # PR rather than joining the change-scoped set above.
  perf-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run bench:cpu

  # The `perf` check branch protection reads: green only when the CPU budgets passed
  # and, when the change can reach rendering, every game the scope named passed too.
  # A red matrix leg shows as a failed job and fails the check here, so one over-budget
  # game still blocks the merge.
  perf:
    needs: [changes, perf-game, perf-cpu]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: perf verdict
        env:
          SCOPE: ${{ needs.changes.outputs.games }}
          GAMES: ${{ needs.changes.outputs.gameList }}
          REASON: ${{ needs.changes.outputs.reason }}
          FRAME: ${{ needs.perf-game.result }}
          CPU: ${{ needs.perf-cpu.result }}
        run: |
          echo "scope=$SCOPE $GAMES ($REASON)"
          test "$CPU" = "success"
          if [ "$SCOPE" = "none" ]; then
            test "$FRAME" = "skipped"
            echo "frame budgets skipped: $REASON"
            exit 0
          fi
          test "$FRAME" = "success"
          echo "frame budgets measured on $GAMES"

  # Three package tests fail on Windows only (#2119: workspaceDoctor's wildcard and dangling
  # symlink cases, and `Bun.build` returning `EINVAL: failed to open root directory: /C:/...` in
  # narrativeAuthoring.test.ts). The Ubuntu jobs cannot see them, so beta learned about them from
  # whoever ran the suite on a PC. This job runs that suite on windows-latest for a push to beta
  # and for workflow_dispatch; a pull request skips it in seconds through `windows`, and no
  # `continue-on-error` or allow-list hides a failure - red here is the point until #2119 closes.
  windows-tests:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/beta')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun --cwd=packages/jgengine run test

  # The `windows` check branch protection reads: green in seconds on a pull request and on a main
  # push, and green on a beta push or manual run only when the Windows suite passed.
  windows:
    needs: [windows-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: windows verdict
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TESTS: ${{ needs.windows-tests.result }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/beta" ]; }; then
            test "$TESTS" = "success"
            exit 0
          fi
          test "$TESTS" = "skipped"
          echo "windows suite skipped: pull requests and main pushes run the Ubuntu suite; a push to beta or a manual run covers Windows"

  ci:
    needs: [changes, quick, types, test, web-build, smoke, perf, windows]
    # A superseded run is cancelled, not failed; reporting it as a failure only pages the PR's owner.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: every required job passed
        env:
          SCOPE: ${{ needs.changes.result }}
          GAMES: ${{ needs.changes.outputs.games }}
          SHARDS: ${{ needs.changes.outputs.tests }}
          REASON: ${{ needs.changes.outputs.reason }}
          SMOKE: ${{ needs.smoke.result }}
          PERF: ${{ needs.perf.result }}
          TEST: ${{ needs.test.result }}
        run: |
          # A scope job that failed took the gated jobs down with it; never let that read as a pass.
          test "$SCOPE" = "success"
          for result in "${{ needs.quick.result }}" "${{ needs.types.result }}" "${{ needs.web-build.result }}" "$PERF" "${{ needs.smoke.result }}" "${{ needs.windows.result }}"; do
            test "$result" = "success"
          done
          echo "game scope: $GAMES ($REASON)"
          if [ "$SHARDS" = "none" ]; then
            test "$TEST" = "skipped"
            echo "skipped: test shards, change notes only"
          else
            test "$TEST" = "success"
            echo "ran: every test shard"
          fi
          case "$GAMES" in
            none)
              test "$SMOKE" = "skipped"
              echo "skipped: smoke and frame gates ($REASON)"
              ;;
            surface)
              test "$SMOKE" = "success"
              echo "ran: smoke and frame budgets on the representative game"
              ;;
            *)
              test "$SMOKE" = "success"
              echo "ran: smoke and frame budgets on every reference game"
              ;;
          esac
      - name: Track red main in one issue
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERDICT: ${{ job.status }}
        run: |
          title="CI red on main"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          run="[Run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          if [ "$VERDICT" = "success" ]; then
            [ -z "$n" ] || gh issue close "$n" --comment "Green again: $run on \`${{ github.sha }}\`."
            exit 0
          fi
          body="Latest failure: $run on \`${{ github.sha }}\`. Fix forward from origin/main on a fresh branch. This issue closes itself when main goes green."
          if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
