name: CI

# Default every job's GITHUB_TOKEN to read-only; jobs that need more (the
# red-main reporter's issues: write) escalate at the job level.
permissions:
  contents: read

on:
  push:
    branches: [main, beta]
  # No `edited`: no step reads the PR body, and a body edit started a second run on the same commit
  # that cancelled the running one, which the queue then read as a failure.
  pull_request:
    types: [opened, synchronize, reopened]

# One run per ref at a time. A pull request cancels its own superseded run: nobody reads the
# old one, and the newest commit is the one that matters. `main` and `beta` do not cancel,
# because their green is a fact someone asks about: on 24 Oct 11 of 44 pushes to beta were
# cancelled, 122 runner-minutes went on runs killed after they started (40115639711,
# 40115766928, 40116041724, 40111249236), and "is beta green" was answered by a run that never
# finished. GitHub still keeps only the newest pending run when a burst arrives, which costs
# nothing; what changes is that no beta run is killed after it starts, so every verdict beta
# reports was reached.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/beta' }}

jobs:
  # Decides which games the `games` job type-checks and tests. `scripts/ci-scope.ts` owns the
  # map; `scripts/ci-scope.test.ts` holds it. `games` (full / surface / none) still says how far a
  # change reaches a booted game, and `lane:close` uses the same verdict to pick the boots it runs
  # locally. `gameChecks` is the list the `games` job checks: each game a changed file sits in,
  # each game that declares a changed engine package, and every game for the root install,
  # compiler settings, games/shared or the games' own scripts.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      games: ${{ steps.scope.outputs.games }}
      gameList: ${{ steps.scope.outputs.gameList }}
      gameChecks: ${{ steps.scope.outputs.gameChecks }}
      tests: ${{ steps.scope.outputs.tests }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "push to ${{ github.ref }} runs the full gate"
            bun scripts/ci-scope.ts --all --github-output
            exit 0
          fi
          git fetch --no-tags origin "$BASE"
          bun scripts/ci-scope.ts --base "origin/$BASE" --github-output

  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check artifacts
      - run: bun run check stage-skills
      - run: git fetch --no-tags origin main
      - run: bun run check changelog
      - run: bun run build
      - run: bun run check skill-api
      # A test that asserts one platform's path separator passes here and fails on the other runner.
      - run: bun run check path-portability
      # One launch/retry block for the engine and for the scaffold every `jgengine create` ships.
      - run: bun run check scaffold-launch
      # A hand-rolled capture script must stay headless; `--headed` is the only window.
      - run: bun run check capture-hygiene
      # One feature, one folder: no second definition of an exported name, no concept file outside its
      # home folder. Reads only this change's diff.
      - name: no duplicate export or stray concept file
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then bun run check concept-homes --base "$BASE_SHA"; else bun run check concept-homes --base HEAD^; fi
      # Needs the `bun run build` above.
      - run: bun run check export-manifest

  # PRs run everything main runs, split into parallel jobs, so squash auto-merge cannot land a red main.
  # The type-check stages used to run one after another: 59 s on a runner, of
  # which the tsc fan-out was 21 s and three generators 23 s. scripts/type-shard.ts runs the
  # checks the table in scripts/run-stages.ts gives the `types` job, four in flight, heaviest first, and keeps this one
  # check name. A second job would have paid 15 s of checkout, install and build before its
  # first stage and taken a slot from the 20-job cap.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun scripts/type-shard.ts

  # One bun process over every test file took 5m37s of test time on a runner. The same
  # files are split by cost into nine jobs whose deepest measured 59 s, which is what fits
  # the account's 20-job cap with room for one more run in flight - three jobs fewer than
  # the ten this started at. scripts/test-shard.ts owns which files each letter runs and
  # what it prepares first, so rebalancing never touches this file; it fails if a test
  # file falls outside every shard, and scripts/test-shard.test.ts fails if this matrix
  # and the script's shard names drift apart. `ci` needs `test`, which aggregates every
  # shard - a red shard fails `ci`. A diff that only adds change notes runs none of them:
  # no test reads `changes/`, and `quick`'s check-changelog still validates the note.
  test:
    needs: [changes]
    if: needs.changes.outputs.tests != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c, d, e, f, g, h, i]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The shard runs the build only when its own tests read a built dist.
      - run: bun scripts/test-shard.ts ${{ matrix.shard }}

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun --cwd=apps/web run build

  # CI never downloads a model or boots a game (Jon, 25 Oct): a booted game needs the pulled
  # packs, and a download or a browser on a runner is minutes of flake for a check the lane's own
  # machine runs in seconds against the shared asset store. `lane:close` runs those boot checks
  # locally (`verify:fast`: the capabilities probe of every game it reaches). `smoke` and `perf`
  # stay as the check names branch protection reads.
  # The games under games/ run engine source from this checkout, so an engine change and the
  # games it breaks are fixed in one PR. This job checks the games `changes` named in
  # `gameChecks`: the games' own gates over every game (seconds each), then the type-check and
  # tests of the reached games only - none needs a pulled model. An empty list skips it, and `ci` holds
  # that skip to the verdict.
  games:
    needs: [changes]
    if: needs.changes.outputs.gameChecks != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAMES: ${{ needs.changes.outputs.gameChecks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: git fetch --no-tags origin beta
      - run: bun run check games-framework --base origin/beta
      - run: bun run check module-globals
      - run: bun run check games-save-states
      - run: bun run check games-design
      - run: bun run check games-ledger
      - run: bun run check games-capabilities --summary
      - name: type-check the reached games
        run: |
          failed=""
          for game in $GAMES; do
            bun --cwd="games/$game" run check-types || failed="$failed $game"
          done
          test -z "$failed" || { echo "type errors in:$failed"; exit 1; }
      - name: test the games' scripts and the reached games
        run: bun test games/scripts games/shared $(for game in $GAMES; do printf 'games/%s ' "$game"; done)

  # The `smoke` check the merge requires. Boots run on the lane's machine (`lane:close`), never
  # here, so this names the scope and passes.
  smoke:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: smoke verdict
        env:
          SCOPE: ${{ needs.changes.outputs.games }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          echo "scope=$SCOPE ($REASON)"
          echo "game boots run locally in lane:close against the shared asset store; CI boots no game"

  # The CPU timing budgets (nav crowd, perception, utility, visibility, off-screen,
  # flock, paths) assert via `perf timing` with JG_TIMING_GATE=1; the unit suite keeps
  # measuring and printing them without a pass/fail ceiling. It needs no browser and
  # takes ~40 s, and core logic in any package can move a budget, so it runs on every
  # PR rather than joining the change-scoped set above.
  perf-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run perf timing

  # The `perf` check branch protection reads: green when the CPU budgets passed. Frame
  # budgets need a booted game, so they run on the lane's machine, not here.
  perf:
    needs: [changes, perf-cpu]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: perf verdict
        env:
          SCOPE: ${{ needs.changes.outputs.games }}
          REASON: ${{ needs.changes.outputs.reason }}
          CPU: ${{ needs.perf-cpu.result }}
        run: |
          echo "scope=$SCOPE ($REASON)"
          test "$CPU" = "success"
          echo "CPU budgets passed; frame budgets need booted games, which run on the lane machine in lane:close, never in CI"

  # Three package tests fail on Windows only (#2119: workspaceDoctor's wildcard and dangling
  # symlink cases, and `Bun.build` returning `EINVAL: failed to open root directory: /C:/...` in
  # narrativeAuthoring.test.ts). The Ubuntu jobs cannot see them, so beta learned about them from
  # whoever ran the suite on a PC. This job runs that suite on windows-latest for a push to beta
  # and for workflow_dispatch; a pull request skips it in seconds through `windows`, and no
  # `continue-on-error` or allow-list hides a failure - red here is the point until #2119 closes.
  windows-tests:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/beta')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun --cwd=packages/jgengine run test

  # The `windows` check branch protection reads: green in seconds on a pull request and on a main
  # push, and green on a beta push or manual run only when the Windows suite passed.
  windows:
    needs: [windows-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: windows verdict
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TESTS: ${{ needs.windows-tests.result }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/beta" ]; }; then
            test "$TESTS" = "success"
            exit 0
          fi
          test "$TESTS" = "skipped"
          echo "windows suite skipped: pull requests and main pushes run the Ubuntu suite; a push to beta or a manual run covers Windows"

  ci:
    needs: [changes, quick, types, test, web-build, games, smoke, perf, windows]
    # A superseded run is cancelled, not failed; reporting it as a failure only pages the PR's owner.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: every required job passed
        env:
          SCOPE: ${{ needs.changes.result }}
          GAMES: ${{ needs.changes.outputs.games }}
          SHARDS: ${{ needs.changes.outputs.tests }}
          REASON: ${{ needs.changes.outputs.reason }}
          SMOKE: ${{ needs.smoke.result }}
          PERF: ${{ needs.perf.result }}
          TEST: ${{ needs.test.result }}
          GAME_CHECKS: ${{ needs.changes.outputs.gameChecks }}
          GAMES_JOB: ${{ needs.games.result }}
        run: |
          # A scope job that failed took the gated jobs down with it; never let that read as a pass.
          test "$SCOPE" = "success"
          for result in "${{ needs.quick.result }}" "${{ needs.types.result }}" "${{ needs.web-build.result }}" "$PERF" "${{ needs.smoke.result }}" "${{ needs.windows.result }}"; do
            test "$result" = "success"
          done
          echo "game scope: $GAMES ($REASON)"
          if [ -z "$GAME_CHECKS" ]; then
            test "$GAMES_JOB" = "skipped"
            echo "skipped: game checks, no game reached"
          else
            test "$GAMES_JOB" = "success"
            echo "ran: game checks on $GAME_CHECKS"
          fi
          if [ "$SHARDS" = "none" ]; then
            test "$TEST" = "skipped"
            echo "skipped: test shards, change notes only"
          else
            test "$TEST" = "success"
            echo "ran: every test shard"
          fi
          test "$SMOKE" = "success"
          echo "game scope $GAMES: boots and frame budgets run locally in lane:close ($REASON)"
      - name: Track red main in one issue
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERDICT: ${{ job.status }}
        run: |
          title="CI red on main"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          run="[Run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          if [ "$VERDICT" = "success" ]; then
            [ -z "$n" ] || gh issue close "$n" --comment "Green again: $run on \`${{ github.sha }}\`."
            exit 0
          fi
          body="Latest failure: $run on \`${{ github.sha }}\`. Fix forward from origin/main on a fresh branch. This issue closes itself when main goes green."
          if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
