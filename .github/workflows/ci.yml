name: CI

# Default every job's GITHUB_TOKEN to read-only; jobs that need more (the
# red-main reporter's issues: write) escalate at the job level.
permissions:
  contents: read

on:
  push:
    branches: [main, beta]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check-artifacts
      - run: bun run check-stage-skills
      - run: bun run check-skills
      - run: git fetch --no-tags origin main
      - run: bun run check-changelog
      - run: bun run build
      - run: bun run check-skill-api
      - run: bun run check-orphan-ratchet
      # Needs the `bun run build` above.
      - run: bun run check-export-manifest

  # PRs run everything main runs, split into parallel jobs, so squash auto-merge cannot land a red main.
  # Games/ is cloned at the SHA in scripts/games-ref.txt; a games-repo push changes nothing here until a PR bumps it.
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:registry
      - run: bun run games:clone
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}
      - run: bun run check-types

  # One bun process over every test file took 5m37s of test time on a runner. The same
  # files are split by path into four jobs of about 90 s; scripts/test-shard.ts owns the
  # split and fails if a test file falls outside every shard, so nothing is dropped.
  # `ci` needs `test`, which aggregates all four shards - a red shard fails `ci`.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [core, ui, sdk, scripts]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:registry
      - run: bun run games:clone
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}
      - run: bun scripts/test-shard.ts ${{ matrix.shard }}

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun --cwd=apps/web run build

  # Four headless boots of the shared shell path, one per runner: the single job's
  # 4m30s was almost all `bun run smoke` (setup is 16 s), so the split is what makes
  # it stop being the critical path. `scripts/smoke-games.test.ts` fails when this
  # matrix and SMOKE_GAMES disagree.
  smoke-game:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        game: [harbor-heat, scrap-signal, drift-foundry, deepward]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run games:clone
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}
      - run: bun run smoke --games ${{ matrix.game }}
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # Green only when every smoke game booted clean, so one unplayable game still
  # blocks the merge through the same `smoke` check as before.
  smoke:
    needs: [smoke-game]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.smoke-game.result }}" = "success"

  # Frame-budget gate: every reference game plays under software GL (CI forces
  # ANGLE/SwiftShader or Mesa llvmpipe), then draws/triangles/nodes are compared
  # against scripts/perf-budget.json and any linkProgram/createFramebuffer after
  # the 5 s warmup fails. Frame times are never gated - CI runners are shared.
  # Eight games in one job took ~5m20s of rendering; one game per runner leaves the
  # wall clock at one game plus setup. `scripts/perf-gate.test.ts` fails when this
  # matrix and PERF_GATE_GAMES disagree, so a ninth game cannot drop out of the gate.
  perf-game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        game: [harbor-heat, scrap-signal, brightway-park, ember-command, beacon-bastion, drift-foundry, odd-orbit, deepward]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run games:clone
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}
      - name: perf gate
        id: gate
        run: bun run perf:gate --games ${{ matrix.game }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # 2 of the first 32 leg runs died on a cold Chrome start ("debugger not ready
      # … within 30000ms") and passed on a plain rerun. A budget breach fails again,
      # so the retry hides nothing; it stops a launch flake from paging a PR owner.
      - name: perf gate (one retry after a browser launch flake)
        if: failure() && steps.gate.outcome == 'failure'
        run: bun run perf:gate --games ${{ matrix.game }}
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # The CPU timing budgets (nav crowd, perception, utility, visibility, off-screen,
  # flock, paths) assert via `bench:cpu` with JG_TIMING_GATE=1; the unit suite keeps
  # measuring and printing them without a pass/fail ceiling. It needs no browser, so
  # it runs beside the frame gate instead of adding ~30 s to the aggregate below.
  perf-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run bench:cpu

  # The `perf` check branch protection reads: green only when all eight frame-budget
  # games and the CPU budgets passed. A red matrix leg shows as a failed job and fails
  # the check here, so a single over-budget game still blocks the merge.
  perf:
    needs: [perf-game, perf-cpu]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          test "${{ needs.perf-game.result }}" = "success"
          test "${{ needs.perf-cpu.result }}" = "success"

  ci:
    needs: [quick, types, test, web-build, smoke, perf]
    # A superseded run is cancelled, not failed; reporting it as a failure only pages the PR's owner.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - run: |
          for result in "${{ needs.quick.result }}" "${{ needs.types.result }}" "${{ needs.test.result }}" "${{ needs.web-build.result }}" "${{ needs.smoke.result }}" "${{ needs.perf.result }}"; do
            test "$result" = "success"
          done
      - name: Track red main in one issue
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERDICT: ${{ job.status }}
        run: |
          title="CI red on main"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' || true)
          run="[Run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          if [ "$VERDICT" = "success" ]; then
            [ -z "$n" ] || gh issue close "$n" --comment "Green again: $run on \`${{ github.sha }}\`."
            exit 0
          fi
          body="Latest failure: $run on \`${{ github.sha }}\`. Fix forward from origin/main on a fresh branch. This issue closes itself when main goes green."
          if [ -n "$n" ]; then gh issue edit "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
