name: Measure tests

# Temporary: per-file timings for one rebalance, then deleted. Runs the current
# shards one file at a time in one process each and uploads the junit XML, whose
# per-file `time` is the only per-file cost a runner reports.
on:
  push:
    branches: [agent/lane-editor-split]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c, d]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run build:registry
      - run: bun run games:clone
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}
      - name: measure ${{ matrix.shard }}
        run: |
          bun scripts/test-shard.ts --print ${{ matrix.shard }} > files.txt
          echo "files: $(wc -l < files.txt), bytes: $(wc -c < files.txt)"
          bun test --timeout 20000 --reporter=junit --reporter-outfile=junit-${{ matrix.shard }}.xml $(cat files.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.shard }}
          path: junit-${{ matrix.shard }}.xml
          if-no-files-found: warn
