name: probe-a118 (throwaway)
on:
  push:
    branches: [agent/lane-a1-18]
  workflow_dispatch:
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c, d, e, f, g, h]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run games:clone
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}
      - name: no dist
        run: |
          files=$(bun scripts/test-shard.ts --print ${{ matrix.shard }})
          s=$(date +%s%N)
          out=$(bun test --timeout 20000 $files 2>&1); c=$?
          e=$(date +%s%N)
          echo "NODIST rc=$c $(( (e-s)/1000000 ))ms :: $(echo "$out" | grep -E '^Ran [0-9]+ tests' || echo 'no summary')"
          echo "$out" | grep -E "^\(fail\)|error:" | head -20
      - name: with dist
        run: |
          bun run build
          files=$(bun scripts/test-shard.ts --print ${{ matrix.shard }})
          s=$(date +%s%N)
          out=$(bun test --timeout 20000 $files 2>&1); c=$?
          e=$(date +%s%N)
          echo "BUILT rc=$c $(( (e-s)/1000000 ))ms :: $(echo "$out" | grep -E '^Ran [0-9]+ tests' || echo 'no summary')"
          echo "$out" | grep -E "^\(fail\)|error:" | head -20

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run games:clone
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}
      - name: types in flight
        run: |
          s=$(date +%s%N)
          bun scripts/type-shard.ts; c=$?
          e=$(date +%s%N)
          echo "TYPES rc=$c $(( (e-s)/1000000 ))ms"
