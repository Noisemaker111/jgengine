name: Publish

# A release is a fast-forward of `main` onto a proved `beta` commit, so the suite that decides
# whether that tree is sound has already run on the merge commit. This workflow starts when that
# run finishes and reads its verdict, instead of running 10,574 tests again on the release commit:
# one environment-sensitive test used to block a release that the PR had already passed (#2279).
#
# What a release still proves, and the PR cannot: the packages build from this exact tree
# (`bun run build`), the published `.d.ts` surface type-checks (`check-types:sdk`), the tree
# carries no source artifacts, the candidate packs into installable tarballs, a real adopter
# compiles against those tarballs, and every published package installs from the registry.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A workflow_run checks out the default branch tip by default, which is not necessarily
          # the commit whose CI just finished; publish the commit CI judged.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g npm@11.19.0
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The whole duplicate suite that used to run here is answered by this one question: did this
      # exact commit pass CI? A red, missing or still-running verdict stops the release.
      - name: Refuse a commit CI has not passed
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: bun scripts/check-release-ci.ts --sha "$SHA"
      - name: Refuse to publish a commit behind beta
        run: bun scripts/check-release-ancestor.ts
      - name: Stage the lockstep changelog into each package
        run: for p in core rapier ws sql navbake react convex node shell assets editor github jgengine; do cp CHANGELOG.md "packages/$p/CHANGELOG.md"; done
      - name: Stage per-package skills
        run: bun run stage-skills
      - run: bun run check-artifacts
      - run: bun run check-release-set
      - run: bun run build
      - run: bun run check-types:sdk
      - run: bun run games:clone
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}
      # `check-release-artifacts` proves packages install and subpaths resolve; it never compiles a
      # consumer, so 0.38.2 narrowed two public types in a patch and passed every artifact check
      # before Harbor Heat and Beacon Bastion failed `check-types`. This packs the candidate,
      # installs the tarballs into the pinned games checkout and compiles all of it. It exits 2 when
      # it cannot check at all, which stops the release the same way a type error does.
      - name: Compile a real adopter against the packed tarballs
        run: bun run check:consumer-types
      - name: Publish packages that are not installable from the registry
        run: |
          # `npm view` reported success for a version whose tarball returned 404 (#2280), and a
          # re-run then skipped the broken package forever. Metadata without a tarball is repaired.
          for p in core rapier ws sql navbake react convex node shell assets editor github jgengine; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            case "$version" in
              *-*) tag=next ;;
              *) tag=latest ;;
            esac
            plan=$(bun scripts/check-release-artifacts.ts --plan "$name@$version")
            echo "$name@$version: $plan"
            if [ "$plan" = "skip" ]; then
              continue
            fi
            if [ "$plan" = "repair" ]; then
              npm unpublish "$name@$version" --force
            fi
            (cd "packages/$p" && npm publish --access public --tag "$tag" --loglevel verbose)
          done
      - name: Verify every published package installs
        run: bun run check:release-artifacts -- --wait 300
