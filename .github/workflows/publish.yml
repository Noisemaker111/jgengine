name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "packages/*/package.json"
      - "packages/*/src/**"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # `bun test packages` in the publish job was 255 s of test time in one job, more
  # than every step after it together, and it ran on the same runner that then had
  # to build and publish. The files are split exactly as CI's `test` job splits
  # them: scripts/test-shard.ts owns the split, `test-shard.test.ts` fails if this
  # matrix and the script's shard names drift apart, and the script fails a file no
  # shard covers. `publish` needs every shard, so a red shard still stops the
  # release instead of publishing over it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c, d, e, f, g, h, i]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun scripts/test-shard.ts ${{ matrix.shard }}
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g npm@11.19.0
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Refuse to publish a commit behind beta
        run: bun scripts/check-release-ancestor.ts
      - name: Stage the lockstep changelog into each package
        run: for p in core rapier ws sql navbake react convex node shell assets editor github jgengine; do cp CHANGELOG.md "packages/$p/CHANGELOG.md"; done
      - name: Stage per-package skills
        run: bun run stage-skills
      - run: bun run check-artifacts
      - run: bun run check-release-set
      - run: bun run build
      - run: bun run check-types:sdk
      - run: bun run games:clone
        env:
          GAMES_CLONE_TOKEN: ${{ secrets.GAMES_CLONE_TOKEN }}
      # `check-release-artifacts` proves packages install and subpaths resolve; it never compiles a
      # consumer, so 0.38.2 narrowed two public types in a patch and passed every artifact check
      # before Harbor Heat and Beacon Bastion failed `check-types`. This packs the candidate,
      # installs the tarballs into the pinned games checkout and compiles all of it. It exits 2 when
      # it cannot check at all, which stops the release the same way a type error does.
      - name: Compile a real adopter against the packed tarballs
        run: bun run check:consumer-types
      - name: Publish packages that are not installable from the registry
        run: |
          # `npm view` reported success for a version whose tarball returned 404 (#2280), and a
          # re-run then skipped the broken package forever. Metadata without a tarball is repaired.
          for p in core rapier ws sql navbake react convex node shell assets editor github jgengine; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            case "$version" in
              *-*) tag=next ;;
              *) tag=latest ;;
            esac
            plan=$(bun scripts/check-release-artifacts.ts --plan "$name@$version")
            echo "$name@$version: $plan"
            if [ "$plan" = "skip" ]; then
              continue
            fi
            if [ "$plan" = "repair" ]; then
              npm unpublish "$name@$version" --force
            fi
            (cd "packages/$p" && npm publish --access public --tag "$tag" --loglevel verbose)
          done
      - name: Verify every published package installs
        run: bun run check:release-artifacts -- --wait 300
