name: Publish

# A release is a `v<version>` tag on a beta commit whose CI is already green: `bun run release`
# pushes the tag only after that verdict, so this workflow reads it instead of running the 10,574
# tests again (one environment-sensitive test used to block a release the PR had passed, #2279).
# Re-run a release with `gh workflow run publish.yml --ref v<version>`.
#
# What a release still proves, and CI cannot: the packages build from this exact tree
# (`bun run build`), the published `.d.ts` surface type-checks (`bun run check --sdk`), the tree
# carries no source artifacts, the candidate packs into installable tarballs, a real adopter
# compiles against those tarballs, and every published package installs from the registry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag names the version this tree publishes
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "publish runs on a release tag: $GITHUB_REF_NAME is not v$version (dispatch it with --ref v$version)"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g npm@11.19.0
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The whole duplicate suite that used to run here is answered by this one question: did this
      # exact commit pass CI? A red, missing or still-running verdict stops the release.
      - name: Refuse a commit CI has not passed
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/check-release-ci.ts --sha "$(git rev-parse HEAD)"
      - name: Refuse to publish a commit that is not on beta
        # A release commit on beta landed through it; beta moving on since is not a stale cut.
        run: bun scripts/check-release-ancestor.ts --landed
      # One copy of the changelog (core) and of the skills (the CLI, which installs them), not one per package.
      - name: Stage the changelog into core
        run: cp CHANGELOG.md packages/core/CHANGELOG.md
      - name: Stage the skills into the CLI
        run: bun scripts/stage-skills.ts
      - run: bun run check artifacts
      - run: bun run check release-set
      # Builds first, then runs the SDK checks against the fresh dist.
      - run: bun run check --sdk
      # Trusted publishing cannot create a package: a name npm has never seen fails mid-loop and leaves
      # `latest` half-published (0.56.0). Refuse before the first publish instead.
      - name: Every package exists on npm and takes trusted publishing
        run: bun scripts/check-npm-trusted.ts
      - name: Publish packages that are not installable from the registry
        run: |
          # `npm view` reported success for a version whose tarball returned 404 (#2280), and a
          # re-run then skipped the broken package forever. Only a confirmed 404 is repaired: the
          # plan exits non-zero when the registry did not answer, and that stops the run here.
          for p in core rapier ws sql navbake convex node assets editor jgengine; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            case "$version" in
              *-*) tag=next ;;
              *) tag=latest ;;
            esac
            plan=$(bun scripts/check-release-artifacts.ts --plan "$name@$version") || {
              echo "$name@$version: registry did not answer, run again"
              exit 1
            }
            echo "$name@$version: $plan"
            case "$plan" in
              skip) continue ;;
              publish) ;;
              repair) npm unpublish "$name@$version" --force ;;
              *) echo "$name@$version: unknown plan '$plan'"; exit 1 ;;
            esac
            (cd "packages/$p" && npm publish --access public --tag "$tag" --loglevel verbose)
          done
      - name: Verify every published package installs
        # npm serves an accepted publish minutes later: 0.49.0's core took 7m12s, so 300 s failed a good release.
        run: bun scripts/check-release-artifacts.ts --wait 900
      - name: Record the release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## $version" '$0 == head { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          flags=""
          case "$version" in *-*) flags="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$version" --notes-file notes.md $flags
