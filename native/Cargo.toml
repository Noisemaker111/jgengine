[workspace]
resolver = "3"
members = [
    "crates/jg-scene",
    "crates/jg-shader",
    "crates/jg-shader-wasm",
    "crates/jg-render",
    "crates/jg-hud",
    "crates/jg-ui",
    "crates/jg-v8",
    "crates/jg-rules",
    "crates/jg-native",
    "crates/jg-web",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
wgpu = { version = "~30.0.1" }
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "1"

[profile.release]
codegen-units = 16
debug = 1

# The engine's shipped translator (crates/jg-shader-wasm): small over fast, no debug info.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
debug = 0
strip = true
panic = "unwind"
