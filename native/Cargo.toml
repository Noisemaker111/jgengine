[workspace]
resolver = "3"
members = [
    "crates/jg-shader",
    "crates/jg-shader-wasm",
    "crates/jg-ui",
]
exclude = ["vendor/rune"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 16
debug = 1

# The engine's shipped translator (crates/jg-shader-wasm): small over fast, no debug info.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
debug = 0
strip = true
panic = "unwind"
