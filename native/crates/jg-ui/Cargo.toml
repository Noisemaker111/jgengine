[package]
name = "jg-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The engine's Rune UI layer: a declarative widget tree from TypeScript, per-frame values through one shared buffer, events and hit regions back to JS once per frame. Web (wasm/WebGPU) and desktop WebView2."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Rune is pre-release and takes no pull requests: vendored at native/vendor/rune
# (upstream dev d751f071) with the jgengine web-transparency patch in
# crates/rune/src/platform/web.rs. See native/vendor/rune/VENDORED.md.
rune = { path = "../../vendor/rune/crates/rune", default-features = false, features = ["embedded-fonts", "svg"] }
rune-taffy = { path = "../../vendor/rune/crates/rune-taffy" }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "HtmlElement"] }
