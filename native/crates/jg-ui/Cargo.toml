[package]
name = "jg-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The engine's Rune UI layer: a declarative widget tree from TypeScript, per-frame values through one shared buffer, events and hit regions back to JS once per frame. Web (wasm/WebGPU) and desktop WebView2."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Rune is pre-release and takes no pull requests: pinned to a commit of `dev` (never rewritten).
rune = { git = "https://github.com/anomalyco/rune", rev = "d751f07106eac47bdd4e33756dee71e1f593c9e2", default-features = false, features = ["embedded-fonts"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
