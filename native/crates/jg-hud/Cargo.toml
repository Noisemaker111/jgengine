[package]
name = "jg-hud"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Deepward's HUD drawn with Rune in the native window, from the game's CSS and the captured HUD reference."

[dependencies]
# Rune is pre-release and takes no pull requests: vendored at native/vendor/rune
# (upstream dev d751f071) with the jgengine web-transparency patch. See
# native/vendor/rune/VENDORED.md.
rune = { path = "../../vendor/rune/crates/rune", default-features = false }
wgpu.workspace = true
