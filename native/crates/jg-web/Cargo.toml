[package]
name = "jg-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The same wgpu replay, compiled to wasm32 and drawn with WebGPU in Chrome (row D)."

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
jg-scene = { path = "../jg-scene" }
jg-render = { path = "../jg-render" }
wgpu.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance"] }
console_error_panic_hook = "0.1"
